[project]
name = "keyboard-tools"
version = "0.1.0"
description = "Backlight control and reverse-engineering tools for the RedSquare Keyrox TKL Classic keyboard (RSQ20020)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["keyboard", "backlight", "rgb", "usb", "reverse-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]
dependencies = ["pyusb>=1.3.1"]

[project.scripts]
kbd-backlight = "keyboard_tools.backlight.cli:main"
kb-poc = "keyboard_tools.reverse.kb:main"
kb-map = "keyboard_tools.reverse.kb_map:main"
kb-probe = "keyboard_tools.reverse.probe:main"

[project.urls]
Homepage = "https://github.com/<user>/keyboard-tools"
Issues = "https://github.com/<user>/keyboard-tools/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keyboard_tools"]

[dependency-groups]
dev = ["ruff>=0.8", "mypy>=1.13", "pytest>=8.0"]

[tool.uv]
default-groups = ["dev"]
